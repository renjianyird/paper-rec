name: Build and Release Windows EXE (MinGW)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  push:
    tags:
      - 'v*'  # 推送 v 开头的标签时自动发布

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW-w64
        run: |
          Invoke-WebRequest -Uri "https://github.com/brechtsanders/winlibs_mingw/releases/download/13.2.0-16.0.6-11.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-13.2.0-mingw-w64ucrt-11.0.0-r1.7z" -OutFile mingw.7z
          7z x -y mingw.7z -oC:\
          echo "C:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify MinGW
        run: |
          gcc --version
          g++ --version

      - name: Build with CMake
        run: |
          mkdir build
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          mingw32-make -j

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: paper-windows-exe
          path: build/*.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: paper-windows-exe
          path: ./
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
