name: Build Paper ADBD Tool with MSVC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_CXX_FLAGS="/MT" ^
            -DCMAKE_C_FLAGS="/MT" ^
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: paper-exe
          path: build/Release/paper.exe
